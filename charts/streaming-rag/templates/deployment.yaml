{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "streaming-rag.fullname" . }}-lucene-data
  labels:
    {{- include "streaming-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streaming-rag.fullname" . }}
  labels:
    {{- include "streaming-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      {{- include "streaming-rag.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        {{- include "streaming-rag.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        {{- if .Values.kafka.enabled }}
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z kafka 29092; do echo "Waiting for Kafka at kafka:29092..."; sleep 3; done
        {{- end }}
        {{- if .Values.ollama.enabled }}
        - name: wait-for-ollama-model
          image: curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              MODEL="{{ .Values.ollama.model }}"
              echo "Waiting for Ollama model $MODEL ..."
              until curl -sf http://ollama:11434/api/tags | grep -q "$MODEL"; do
                sleep 5
              done
              echo "Model available."
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "streaming-rag.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "streaming-rag.fullname" . }}-config
          {{- if .Values.langsmith.enabled }}
          env:
            - name: LANGCHAIN_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.langsmith.existingSecret }}
                  name: {{ .Values.langsmith.existingSecret }}
                  key: {{ .Values.langsmith.existingSecretKey }}
                  {{- else }}
                  name: {{ include "streaming-rag.fullname" . }}-secrets
                  key: LANGCHAIN_API_KEY
                  {{- end }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: lucene-data
              mountPath: /app/data
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: lucene-data
          persistentVolumeClaim:
            claimName: {{ include "streaming-rag.fullname" . }}-lucene-data
      {{- end }}
