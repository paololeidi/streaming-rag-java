# ---------------------------------------------------------------------------
# Ultra-Lightweight Infrastructure Profile (Kafka only)
# ---------------------------------------------------------------------------
# Designed for local development on personal laptops:
# - Runs Apache Kafka in Docker (~150MB RAM total, zero disk swap).
# - Vector Database is embedded directly in-process via Apache Lucene (no ChromaDB container needed!).
# - Allows you to run Ollama and the Spring Boot Java App directly on Windows host.
# - Leaves 95%+ of CPU and RAM free for your operating system and native LLM.
#
# Usage:
#   docker compose -f docker-compose.infra.yml up -d
# ---------------------------------------------------------------------------

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: streaming-rag-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 5
