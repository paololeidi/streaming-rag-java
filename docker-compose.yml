services:
  # ---------------------------------------------------------------------------
  # Apache Kafka (KRaft mode - Zero Zookeeper dependency)
  # Configured with dual listeners:
  # - PLAINTEXT_HOST (localhost:9092) for host-side IDE/CLI apps
  # - PLAINTEXT (kafka:29092) for internal docker containers
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: streaming-rag-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 5

  # ---------------------------------------------------------------------------
  # Ollama Local LLM Runtime (Default Hermetic Container)
  # Runs out-of-the-box for evaluators, recruiters, and self-contained demos.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: streaming-rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Enterprise Streaming RAG Java Application
  # Runs embedded Apache Lucene vector store in-process (zero external vector DB container).
  # Connects to the in-docker Ollama service (http://ollama:11434).
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streaming-rag-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_LUCENE_INDEX_PATH: /app/data/lucene-index
      APP_LUCENE_IN_MEMORY: "false"
      APP_OLLAMA_BASE_URL: ${APP_OLLAMA_BASE_URL:-http://ollama:11434}
      APP_OLLAMA_TIMEOUT_SECONDS: 180
      APP_PRODUCER_ENABLED: "true"
      APP_PRODUCER_FIXED_RATE_MS: 1500
    volumes:
      - lucene-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lucene-data:
  ollama-data:
